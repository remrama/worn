name: worn
description: Worn - A simple app for logging wearable device status
publish_to: 'none'
version: 1.2.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  uuid: ^4.6.0
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  share_plus: ^13.3.1
  path_provider: ^2.1.6
  awesome_notifications: ^0.12.1
  font_awesome_flutter: ^11.0.0
  material_ui: ^1.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: 'assets/icon/icon.png'
  web:
    generate: true
